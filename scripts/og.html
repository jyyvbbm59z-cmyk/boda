<!doctype html>
<!-- Plantilla de la imagen que sale al compartir el enlace (1200×630).
     Regenerar: python3 scripts/og.py "Carlos" "Nombre" "24.04.2027" -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Gloock; src: url(../public/fonts/gloock-400.woff2); }

html, body { margin: 0; }
body { width: 1200px; height: 630px; display: grid; place-items: center;
  background: #d3d9d3 url(../public/img/azulejo.svg) 0 0 / 105px 105px; }
.placa { width: 760px; height: 420px; background: #fcfcfa; display: flex; flex-direction: column;

.f { font: 400 44px Gloock; color: #1a2547; letter-spacing: 3px; margin: 0; }
.l { font: 500 26px Hanken; color: #4a5672; margin: 10px 0 0; }
